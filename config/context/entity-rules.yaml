- id: signup_user_id_anchor
  entity: signup
  category: entity_rule
  applies_to_columns:
  - user_id
  - anonymous_id
  message: One row per signup attempt. `anonymous_id` is the browser cookie; `user_id` is NULL until account
    creation completes. Do not join subscriptions on anonymous_id after account linking — use `user_id`.
  source: ONB-001, 2026-08-14
- id: trial_started_double_fire
  entity: event
  category: entity_rule
  applies_to_columns:
  - event_name
  - event_id
  - event_ts
  - user_id
  message: Client and server events. `event_name = 'trial_started'` can fire twice within 60s when the
    mobile SDK retries — dedupe on `(user_id, DATE(event_ts), event_id)` not raw row count.
  source: ONB-001, 2026-09-02
- id: funnel_step_rename_cutover
  entity: funnel
  category: entity_rule
  applies_to_columns:
  - event_name
  - properties
  message: Upgrade-path step keys (events table). Rows with event name `step_viewed` carry a `step_key`
    inside JSON properties. Legacy keys `plan_review` and `wallet_entry` were merged to `combined_step`
    in app v3.4; queries before 2026-09-01 must map old keys.
